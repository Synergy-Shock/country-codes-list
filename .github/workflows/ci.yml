name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run tests
        run: npm test

  package-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack, install and import the tarball
        run: |
          TARBALL="$PWD/$(npm pack --silent)"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" typescript@5 @types/node@22
          node -e "const c = require('country-codes-list').findOneByCode('UK'); if (!c || c.countryCode !== 'GB') process.exit(1)"
          cat > check.ts <<'EOF'
          import { findOneByCode, CountryData } from "country-codes-list";
          const c: CountryData | undefined = findOneByCode("UK");
          export const code: string | undefined = c?.countryCode;
          EOF
          npx tsc --noEmit --strict --esModuleInterop --module commonjs --moduleResolution node10 --target es2020 --types node check.ts
