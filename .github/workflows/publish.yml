name: Publish to NPM

on:
  push:
    tags:
      - "v*"

# id-token: write is required for Trusted Publishing (OIDC) — no NPM_TOKEN needed.
# contents: write lets the workflow create the GitHub Release for the tag.
permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Node 22 ships npm 10; Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run tests
        run: npm test
      # Auth is via OIDC; provenance is generated automatically on public repos.
      - name: Publish package
        run: npm publish

      # Create the GitHub Release for this tag (skips if it already exists,
      # e.g. on a re-run). Notes are auto-generated from merged PRs/commits.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
