version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest 29 requires typescript >=4.3 <7. Drop this once ts-jest supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]
      # Types track the oldest Node we run tooling on (22), not the newest.
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
