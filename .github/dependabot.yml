version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest 29 requires typescript >=4.3 <7. Drop this once ts-jest supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
